[package]
name = "LogLib2Server"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "LogLib2 logging event server - receives log events via TCP/UDP and outputs to console and rotating files"
homepage = "https://github.com/nosial/LogLib2Server"
repository = "https://github.com/nosial/LogLib2Server"
readme = "README.md"
keywords = ["logging", "log", "server", "tcp", "udp"]
categories = ["network-programming", "command-line-utilities"]

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }

[profile.dev]
opt-level = 0
debug = 1
strip = "none"
incremental = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
debug = false
incremental = false

[profile.test]
opt-level = 0
debug = 2
strip = "none"

[profile.bench]
opt-level = 3
debug = false
lto = "fat"
codegen-units = 1

[lints.rust]
unsafe_code = "deny"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_import_braces = "warn"
unused_qualifications = "warn"
variant_size_differences = "warn"

[lints.clippy]
pedantic = "warn"
nursery = "warn"
cargo = "warn"
